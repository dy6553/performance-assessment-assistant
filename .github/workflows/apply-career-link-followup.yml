name: Apply career link UX follow-up

on:
  push:
    branches:
      - feat/career-link-ux-tests-cleanup-20260905

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply focused follow-up
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json

          def replace_once(path: str, old: str, new: str):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one match, found {count}: {old[:120]!r}")
              p.write_text(text.replace(old, new, 1))

          # 1) Pure policy function so per-assignment override behavior can be regression-tested.
          Path("src/features/assessment/career-link-policy.ts").write_text('''export function resolveCareerLinkUsage(\n  careerLinked: boolean | null | undefined,\n  accountDefault: boolean,\n): boolean {\n  return careerLinked ?? accountDefault;\n}\n''')

          replace_once(
              "src/features/assessment/server/career-context.ts",
              'import type { AssignmentInput, TopicRecommendationRequest } from "../schemas";\n',
              'import { resolveCareerLinkUsage } from "../career-link-policy";\nimport type { AssignmentInput, TopicRecommendationRequest } from "../schemas";\n',
          )
          replace_once(
              "src/features/assessment/server/career-context.ts",
              '  const shouldUseCareer = careerLinked ?? profile.career_use_default;\n',
              '  const shouldUseCareer = resolveCareerLinkUsage(careerLinked, profile.career_use_default);\n',
          )

          # 2) Reusable status badge for topic/draft/final and workspace surfaces.
          Path("src/features/assessment/career-link-status-badge.tsx").write_text('''import type { AssignmentInput } from "./schemas";\n\nexport function CareerLinkStatusBadge({ value }: { value: AssignmentInput["careerLinked"] }) {\n  const state = value === true\n    ? { label: "진로연계 O", description: "이 수행평가에서 진로 정보를 참고합니다.", className: "bg-violet-100 text-violet-800" }\n    : value === false\n      ? { label: "진로연계 X", description: "이 수행평가에서 진로 정보를 사용하지 않습니다.", className: "bg-slate-200 text-slate-700" }\n      : { label: "진로연계 기본값", description: "기존 수행평가라 계정의 기본 진로 설정을 따릅니다.", className: "bg-amber-100 text-amber-800" };\n\n  return (\n    <span\n      aria-label={state.description}\n      className={`inline-flex rounded-full px-3 py-1.5 text-xs font-black ${state.className}`}\n      title={state.description}\n    >\n      {state.label}\n    </span>\n  );\n}\n''')

          # 3) Consolidate setup UI: AssessmentWizard delegates its legacy setup screen to CompactAssignmentSetup.
          wizard = Path("src/features/assessment/assessment-wizard.tsx")
          text = wizard.read_text()
          text = text.replace(
              'import { CareerLinkSelector } from "./career-link-selector";\nimport { PdfRubricUpload } from "./pdf-rubric-upload";\n',
              'import { CareerLinkStatusBadge } from "./career-link-status-badge";\nimport { CompactAssignmentSetup } from "./compact-assignment-setup";\n',
              1,
          )
          text = text.replace(
              '  const typeMeta = getAssignmentTypeByValue(assignment.assignmentType);\n  const maxGrade = assignment.schoolLevel === "초등학교" ? 6 : 3;\n',
              '  const typeMeta = getAssignmentTypeByValue(assignment.assignmentType);\n',
              1,
          )
          loading_block = '''  if (!hydrated) {\n    return (\n      <main className="mx-auto min-h-[70dvh] max-w-5xl px-4 py-8 sm:px-6">\n        <div className="rounded-[2rem] border border-slate-200 bg-white p-8 shadow-sm">\n          <p className="text-sm font-black text-violet-700">수행평가 정보를 불러오는 중입니다.</p>\n        </div>\n      </main>\n    );\n  }\n\n'''
          if loading_block not in text:
              raise SystemExit("assessment-wizard.tsx: loading block not found")
          text = text.replace(
              loading_block,
              loading_block + '''  if (screen === "setup") {\n    return <CompactAssignmentSetup typeSlug={typeSlug ?? typeMeta.slug} keepType />;\n  }\n\n''',
              1,
          )

          setup_jsx_start = text.find('      {screen === "setup" ? (')
          topic_jsx_start = text.find('      {screen === "topic" ? (')
          if setup_jsx_start < 0 or topic_jsx_start < 0 or topic_jsx_start <= setup_jsx_start:
              raise SystemExit("assessment-wizard.tsx: setup/topic render block boundaries not found")
          text = text[:setup_jsx_start] + text[topic_jsx_start:]

          setup_fn_start = text.find('function SetupScreen(')
          topic_fn_start = text.find('function TopicScreen(')
          if setup_fn_start < 0 or topic_fn_start < 0 or topic_fn_start <= setup_fn_start:
              raise SystemExit("assessment-wizard.tsx: legacy setup function boundaries not found")
          text = text[:setup_fn_start] + text[topic_fn_start:]

          topic_badges = '''        <ContextBadge>{assignment.subject}</ContextBadge>\n        <ContextBadge>{assignment.curriculum}</ContextBadge>\n'''
          if topic_badges not in text:
              raise SystemExit("assessment-wizard.tsx: topic badges anchor not found")
          text = text.replace(
              topic_badges,
              topic_badges + '        <CareerLinkStatusBadge value={assignment.careerLinked} />\n',
              1,
          )
          workspace_badges = '''          <span className="rounded-full bg-white px-3 py-1 text-xs font-bold text-slate-600">분류 신뢰도 {Math.round(analysis.taskType.confidence * 100)}%</span>\n          <span className="rounded-full bg-white px-3 py-1 text-xs font-bold text-slate-600">{analysis.curriculum.version}</span>\n'''
          if workspace_badges not in text:
              raise SystemExit("assessment-wizard.tsx: workspace badges anchor not found")
          text = text.replace(
              workspace_badges,
              workspace_badges + '          <CareerLinkStatusBadge value={assignment.careerLinked} />\n',
              1,
          )
          if 'function SetupScreen(' in text or 'function TypeSpecificFields(' in text:
              raise SystemExit("assessment-wizard.tsx: legacy setup implementation still present")
          wizard.write_text(text)

          # Draft page badge.
          replace_once(
              "src/app/assignment/draft/page.tsx",
              'import type { AnalysisResult, AssignmentInput, DraftResult, VerificationResult } from "@/features/assessment/schemas";\n',
              'import { CareerLinkStatusBadge } from "@/features/assessment/career-link-status-badge";\nimport type { AnalysisResult, AssignmentInput, DraftResult, VerificationResult } from "@/features/assessment/schemas";\n',
          )
          replace_once(
              "src/app/assignment/draft/page.tsx",
              '            <h1 className="truncate text-lg font-black text-slate-950">{draft.title}</h1>\n',
              '            <h1 className="truncate text-lg font-black text-slate-950">{draft.title}</h1>\n            {assignment ? <div className="mt-1"><CareerLinkStatusBadge value={assignment.careerLinked} /></div> : null}\n',
          )

          # Final page badge.
          replace_once(
              "src/app/assignment/final/page.tsx",
              'import type { AssignmentInput, DraftResult, VerificationResult } from "@/features/assessment/schemas";\n',
              'import { CareerLinkStatusBadge } from "@/features/assessment/career-link-status-badge";\nimport type { AssignmentInput, DraftResult, VerificationResult } from "@/features/assessment/schemas";\n',
          )
          replace_once(
              "src/app/assignment/final/page.tsx",
              '        {assignment ? <p className="mt-3 rounded-xl bg-white/80 px-3 py-2 text-xs font-black text-slate-600">{assignment.subject} · {assignment.topic}</p> : null}\n',
              '''        {assignment ? (\n          <div className="mt-3 flex flex-wrap items-center gap-2">\n            <span className="rounded-xl bg-white/80 px-3 py-2 text-xs font-black text-slate-600">{assignment.subject} · {assignment.topic}</span>\n            <CareerLinkStatusBadge value={assignment.careerLinked} />\n          </div>\n        ) : null}\n''',
          )

          # Regression tests: explicit O wins over account OFF, explicit X wins over account ON, legacy null falls back.
          tests = Path("tests")
          tests.mkdir(exist_ok=True)
          Path("tests/career-link-policy.test.mjs").write_text('''import test from "node:test";\nimport assert from "node:assert/strict";\n\nimport { resolveCareerLinkUsage } from "../src/features/assessment/career-link-policy.ts";\n\ntest("per-assignment O overrides an account default of OFF", () => {\n  assert.equal(resolveCareerLinkUsage(true, false), true);\n});\n\ntest("per-assignment X overrides an account default of ON", () => {\n  assert.equal(resolveCareerLinkUsage(false, true), false);\n});\n\ntest("legacy null selection falls back to the account default", () => {\n  assert.equal(resolveCareerLinkUsage(null, true), true);\n  assert.equal(resolveCareerLinkUsage(null, false), false);\n});\n''')

          package_path = Path("package.json")
          package = json.loads(package_path.read_text())
          scripts = package.setdefault("scripts", {})
          scripts["test"] = "node --test tests/*.test.mjs"
          scripts["check"] = "npm run typecheck && npm run lint && npm run test"
          package_path.write_text(json.dumps(package, ensure_ascii=False, indent=2) + "\n")

          replace_once(
              ".github/workflows/ci.yml",
              '      - name: Lint\n        run: npm run lint\n      - name: Build\n',
              '      - name: Lint\n        run: npm run lint\n      - name: Regression tests\n        run: npm run test\n      - name: Build\n',
          )

          # Keep the GitHub design record synchronized with the implementation.
          doc = Path("docs/career-profile-personalization.md")
          doc_text = doc.read_text().rstrip()
          marker = "## 2026-09-05 진로연계 UX·회귀테스트 보완"
          if marker not in doc_text:
              doc_text += '''\n\n---\n\n## 2026-09-05 진로연계 UX·회귀테스트 보완\n\n진로연계 O/X 기능의 가시성·회귀 안정성·유지보수성을 다음과 같이 보완한다.\n\n### 상태 가시성\n\n- 주제 선택 화면에 `진로연계 O`, `진로연계 X`, 기존 데이터의 `진로연계 기본값` 배지를 표시한다.\n- 작성 전략/초고 화면과 완성본 화면에도 같은 배지를 표시한다.\n- 사용자는 현재 수행평가가 진로 정보를 사용하는지 다음 단계에서도 계속 확인할 수 있다.\n\n### 회귀 테스트\n\n`resolveCareerLinkUsage` 정책 함수를 분리하고 Node 기본 테스트 러너로 다음 3가지 핵심 경우를 자동 검증한다.\n\n1. 수행평가 `O` + 계정 기본 `OFF` → 진로 정보 사용\n2. 수행평가 `X` + 계정 기본 `ON` → 진로 정보 미사용\n3. 기존 수행평가 `null` → 계정 기본값을 그대로 따름\n\nGitHub CI는 TypeScript, ESLint, 위 회귀 테스트, Next.js production build 순으로 검증한다.\n\n### 설정 UI 단일화\n\n실제 라우트가 사용하는 `CompactAssignmentSetup`을 수행평가 설정의 단일 구현으로 유지한다. `AssessmentWizard`에 남아 있던 레거시 `SetupScreen`과 중복 유형별 입력 구현은 제거하고, 혹시 남아 있는 `screen=setup` 호출도 `CompactAssignmentSetup`으로 위임한다. 이에 따라 진로연계 O/X 검증과 입력 규칙을 한 곳에서 유지한다.\n'''
              doc.write_text(doc_text + "\n")

          # Focused invariants before npm checks.
          required = {
              "src/features/assessment/career-link-policy.ts": ["return careerLinked ?? accountDefault;"],
              "src/features/assessment/assessment-wizard.tsx": ["<CompactAssignmentSetup", "<CareerLinkStatusBadge value={assignment.careerLinked}"],
              "src/app/assignment/draft/page.tsx": ["<CareerLinkStatusBadge value={assignment.careerLinked}"],
              "src/app/assignment/final/page.tsx": ["<CareerLinkStatusBadge value={assignment.careerLinked}"],
              "tests/career-link-policy.test.mjs": ["O overrides", "X overrides", "legacy null"],
              ".github/workflows/ci.yml": ["Regression tests", "npm run test"],
              "docs/career-profile-personalization.md": [marker],
          }
          for path, needles in required.items():
              body = Path(path).read_text()
              for needle in needles:
                  if needle not in body:
                      raise SystemExit(f"{path}: missing invariant {needle}")
          PY
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck, lint, regression tests
        run: npm run check
      - name: Production build
        run: npm run build
      - name: Commit verified changes
        shell: bash
        run: |
          rm .github/workflows/apply-career-link-followup.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: improve career link UX and regression coverage"
          git push origin HEAD:feat/career-link-ux-tests-cleanup-20260905
