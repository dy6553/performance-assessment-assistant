name: Apply review fixes

on:
  push:
    branches:
      - feat/career-link-per-assignment-20260904

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected 1 match, found {count}")
              p.write_text(text.replace(old, new, 1))

          replace_once(
              "src/components/ai-stage-actions.tsx",
              '''  useEffect(() => {\n    setHasDraft(Boolean(readSession<DraftResult>(assessmentDraftStorageKey)));\n    setOpen(false);\n    setInstruction(\"\");\n    setError(\"\");\n    setTopicResult(null);\n    setDraftResult(null);\n  }, [pathname]);''',
              '''  useEffect(() => {\n    const frame = window.requestAnimationFrame(() => {\n      setHasDraft(Boolean(readSession<DraftResult>(assessmentDraftStorageKey)));\n      setOpen(false);\n      setInstruction(\"\");\n      setError(\"\");\n      setTopicResult(null);\n      setDraftResult(null);\n    });\n    return () => window.cancelAnimationFrame(frame);\n  }, [pathname]);''',
          )

          replace_once(
              "src/components/ai-stage-actions.tsx",
              '''            assignmentType: assignment.assignmentType,\n            teacherInstruction: assignment.teacherInstruction,''',
              '''            assignmentType: assignment.assignmentType,\n            careerLinked: assignment.careerLinked,\n            teacherInstruction: assignment.teacherInstruction,''',
          )

          replace_once(
              "src/components/local-data-boundary.tsx",
              '''  const pathname = usePathname();\n  const [ready, setReady] = useState(!ownerId);\n  const [saveState, setSaveState] = useState<SaveState>(\"idle\");\n\n  useEffect(() => {\n    configureLocalOwner(ownerId);\n    if (!ownerId) {\n      setReady(true);\n      return;\n    }\n    let cancelled = false;\n    setReady(false);\n    void hydrateAndMigrateLocalData(ownerId)\n      .then(() => { if (!cancelled) setReady(true); })\n      .catch(() => { if (!cancelled) { setReady(true); setSaveState(\"error\"); } });\n    return () => { cancelled = true; };\n  }, [ownerId]);''',
              '''  const pathname = usePathname();\n  const [readyOwnerId, setReadyOwnerId] = useState<string | null>(null);\n  const [saveState, setSaveState] = useState<SaveState>(\"idle\");\n  const ready = !ownerId || readyOwnerId === ownerId;\n\n  useEffect(() => {\n    configureLocalOwner(ownerId);\n    if (!ownerId) return;\n    let cancelled = false;\n    void hydrateAndMigrateLocalData(ownerId)\n      .then(() => { if (!cancelled) setReadyOwnerId(ownerId); })\n      .catch(() => {\n        if (!cancelled) {\n          setReadyOwnerId(ownerId);\n          setSaveState(\"error\");\n        }\n      });\n    return () => { cancelled = true; };\n  }, [ownerId]);''',
          )

          replace_once(
              "src/lib/ai/model-auto-approval.ts",
              '''function capabilityRecord(value: unknown): Record<string, any> {\n  return typeof value === \"object\" && value !== null && !Array.isArray(value)\n    ? (value as Record<string, any>)\n    : {};\n}''',
              '''function capabilityRecord(value: unknown): Record<string, unknown> {\n  return typeof value === \"object\" && value !== null && !Array.isArray(value)\n    ? (value as Record<string, unknown>)\n    : {};\n}''',
          )

          replace_once(
              "src/lib/local-data/backup.ts",
              '''  const stripOwner = <T extends Record<string, unknown>>(row: T) => {\n    const { ownerId: _ownerId, key: _key, ...rest } = row;\n    return rest;\n  };''',
              '''  const stripOwner = <T extends Record<string, unknown>>(row: T) =>\n    Object.fromEntries(Object.entries(row).filter(([key]) => key !== \"ownerId\" && key !== \"key\"));''',
          )
          PY
          git diff --check
      - name: Commit fixes
        shell: bash
        run: |
          rm .github/workflows/fix-review-findings.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: address assessment review findings"
          git push origin HEAD:feat/career-link-per-assignment-20260904
