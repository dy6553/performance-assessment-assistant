name: One-time priority Korean publisher policy

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-time-priority-korean-publishers-20260917.yml

permissions:
  contents: write

jobs:
  apply-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply minimal model approval policy update
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/lib/ai/model-auto-approval.ts')
          text = path.read_text()

          def replace_once(old: str, new: str):
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'Expected exactly one match, found {count}: {old[:100]!r}')
              text = text.replace(old, new, 1)

          replace_once(
              'const POLICY_VERSION = "2026-09-17.2-korean-trusted-chat";',
              'const POLICY_VERSION = "2026-09-17.3-priority-publisher-korean";',
          )

          marker = 'const BLOCKED_PUBLISHERS = new Set([\n'
          priority = '''// Models from these reviewed companies are evaluated as priority candidates.\n// Their company reliability is treated as a policy input, so the model review focuses\n// on Korean capability and the existing operational/student-data gates.\nconst PRIORITY_PUBLISHERS = new Set([\n  "nvidia",\n  "openai",\n  "google",\n  "meta",\n  "microsoft",\n  "mistralai",\n  "nv-mistralai",\n]);\n\n'''
          replace_once(marker, priority + marker)

          old_sort = '''    .sort((a, b) =>\n      reviewClass(a) - reviewClass(b) ||\n      reviewPriority(a) - reviewPriority(b) ||\n      String(a.catalog_first_seen_at ?? "").localeCompare(String(b.catalog_first_seen_at ?? "")),\n    )\n'''
          new_sort = '''    .sort((a, b) =>\n      // Keep existing workload classes first, then prioritize the six reviewed\n      // companies within the same class so chat-capable models are not displaced\n      // by embeddings/parsers solely because of publisher name.\n      reviewClass(a) - reviewClass(b) ||\n      Number(PRIORITY_PUBLISHERS.has(publisherOf(b.model_id))) -\n        Number(PRIORITY_PUBLISHERS.has(publisherOf(a.model_id))) ||\n      reviewPriority(a) - reviewPriority(b) ||\n      String(a.catalog_first_seen_at ?? "").localeCompare(String(b.catalog_first_seen_at ?? "")),\n    )\n'''
          replace_once(old_sort, new_sort)

          replace_once(
              '  const origin = TRUSTED_PUBLISHERS[publisher];\n  const reasons: string[] = [];',
              '  const origin = TRUSTED_PUBLISHERS[publisher];\n  const priorityPublisher = PRIORITY_PUBLISHERS.has(publisher);\n  const reasons: string[] = [];',
          )

          replace_once(
              '      externalEvidenceVerified: official.modelPage || official.modelCard,',
              '      externalEvidenceVerified: official.modelPage || official.modelCard,\n      priorityPublisher,',
          )

          replace_once(
              '      "NVIDIA 제공 경로·비중국계 신뢰 개발사·학생 데이터 허용 기준 통과",',
              '      priorityPublisher\n        ? "우선 개발사 모델: 개발사 신뢰도 재심사 없이 한국어 능력 중심 평가; NVIDIA 제공 경로·학생 데이터 허용 기준 유지"\n        : "NVIDIA 제공 경로·비중국계 신뢰 개발사·학생 데이터 허용 기준 통과",',
          )

          path.write_text(text)

          doc = Path('docs/2026-09-17-priority-publisher-korean-evaluation.md')
          doc.write_text('''# 우선 개발사 모델의 한국어 중심 승인 정책\n\n적용일: 2026-09-17\n\n## 변경 목적\n\n기존 NVIDIA 모델 자동 승인 흐름, 재심사 주기, 동시성, 점수 기준은 유지하면서 NVIDIA, OpenAI, Google, Meta, Microsoft, Mistral AI 모델을 우선 승인 후보로 심사한다. `nv-mistralai`는 NVIDIA/Mistral 공동 제공 별칭으로 같은 우선 그룹에 포함한다.\n\n## 적용 규칙\n\n- 우선 개발사 모델은 동일한 기존 `reviewClass` 안에서 다른 신뢰 개발사 모델보다 먼저 심사한다. 임베딩·가드·파서처럼 기존에 후순위인 비대화형 모델 분류는 유지한다.\n- 위 개발사에 대해서는 모델마다 개발사 신뢰도를 다시 평가하는 절차를 승인 판단의 핵심으로 사용하지 않는다. 개발사 정보는 사전 검토된 정책 입력으로 취급한다.\n- 실제 모델 승인은 회사 이름만으로 이뤄지지 않는다. 기존과 동일하게 NVIDIA API 실제 호출 성공, Structured Output, 한국어 내부 benchmark 통과가 hard pass 조건이다.\n- NVIDIA 제공 경로 및 학생 데이터 사용에 관한 provider 정책 확인은 유지한다. 우선 개발사라도 한국어 benchmark 또는 실제 호출에 실패하면 승인되지 않는다.\n- 그 외 개발사의 기존 allowlist/차단 정책과 재심사 로직은 변경하지 않는다.\n\n## 구현\n\n`src/lib/ai/model-auto-approval.ts`에 `PRIORITY_PUBLISHERS`를 추가하고 정책 버전을 `2026-09-17.3-priority-publisher-korean`으로 올렸다. 승인 결과의 `evaluation_profile_json`에 `priorityPublisher`를 기록해 우선 그룹 여부를 확인할 수 있게 했다.\n\n데이터베이스 스키마 변경은 없다.\n''')
          PY

      - name: Commit policy and documentation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/ai/model-auto-approval.ts docs/2026-09-17-priority-publisher-korean-evaluation.md
          git rm .github/workflows/one-time-priority-korean-publishers-20260917.yml
          git commit -m "feat: prioritize Korean evaluation for selected AI publishers"
          git push origin HEAD:main
