name: Fast apply career link patch

on:
  push:
    branches:
      - feat/career-link-per-assignment-20260904

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply embedded source patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import textwrap

          workflow = Path('.github/workflows/apply-career-link-toggle.yml').read_text()
          start = "          python3 - <<'PY'\n"
          end = "\n          PY\n"
          if start not in workflow or end not in workflow:
              raise SystemExit('embedded patch block not found')
          block = workflow.split(start, 1)[1].split(end, 1)[0]
          exec(compile(textwrap.dedent(block), 'career-link-patch', 'exec'))
          PY
      - name: Diff sanity check
        run: git diff --check
      - name: Commit source changes
        shell: bash
        run: |
          rm .github/workflows/apply-career-link-toggle.yml .github/workflows/fast-apply-career-link.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add per-assignment career link O X"
          git push origin HEAD:feat/career-link-per-assignment-20260904
